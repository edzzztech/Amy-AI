<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Amy AI</title>
<meta name="description" content="That page does not exist. Amy AI is a local-first voice assistant for Windows, powered by Ollama.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#07080c; --text:#e8eaf2; --muted:#8c92a6;
    --accent:#5eead4; --accent-2:#a78bfa; --line:rgba(255,255,255,.09);
    --surface-2:#13161f; --accent-ink:#04221d;
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#fbfbfa;--text:#15171c;--muted:#5c6170;--accent:#0d9488;--accent-2:#7c3aed;
          --line:rgba(0,0,0,.10);--surface-2:#f6f6f4;--accent-ink:#fff}
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:var(--sans);display:grid;place-items:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .box{max-width:48ch;text-align:center}
  .orb{
    width:72px;height:72px;border-radius:50%;margin:0 auto 26px;
    background:radial-gradient(circle at 32% 30%, var(--accent), var(--accent-2) 72%);
    box-shadow:0 0 0 8px rgba(94,234,212,.08);
  }
  .code{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:12px;
  }
  h1{font-size:clamp(1.6rem,5vw,2.2rem);letter-spacing:-.02em;margin:0 0 12px}
  p{color:var(--muted);line-height:1.65;margin:0 0 26px}
  .links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{
    display:inline-flex;align-items:center;padding:10px 18px;border-radius:10px;
    text-decoration:none;font-size:.93rem;font-weight:580;
  }
  .primary{background:var(--accent);color:var(--accent-ink)}
  .ghost{border:1px solid var(--line);color:var(--text)}
  .ghost:hover{background:var(--surface-2)}
</style>
</head>
<body>
  <div class="box">
    <div class="orb"></div>
    <div class="code">Error 404</div>
    <h1>That page doesn't exist</h1>
    <p>
      The link may be out of date. Amy AI is a local-first voice assistant for Windows
      that sees your screen, controls your apps and runs entirely on your own machine.
    </p>
    <div class="links">
      <a class="primary" href="/Amy-AI/">Go to the homepage</a>
      <a class="ghost" href="https://github.com/edzzztech/Amy-AI">View the source</a>
    </div>
  </div>
</body>
</html>
